name: Firmware Dumper

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'SamFW Direct Download Link'
        required: true
      compression_level:
        description: 'XZ Compression Level (0-9)'
        required: false
        default: '9'
      partitions:
        description: 'Partitions to Extract (Space separated)'
        required: false
        default: 'boot init_boot vbmeta dtbo system system_ext product vendor vendor_boot vendor_dlkm system_dlkm'

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            jq \
            xz-utils \
            lz4 \
            unzip \
            curl \
            pv \
            android-sdk-libsparse-utils

      - name: Make tools executable
        run: chmod +x bin/lp/* bin/ext4/* bin/erofs-utils/* bin/py_scripts/* upload_gofile.sh scripts/dump.sh

      - name: Run Dump Script
        run: bash scripts/dump.sh "${{ github.event.inputs.url }}" "${{ github.event.inputs.compression_level }}" "${{ github.event.inputs.partitions }}"

      - name: Upload to GoFile
        run: |
          if [ -d "processed" ] && [ "$(ls -A processed)" ]; then
            cd processed
            zip -r ../firmware-dump.zip .
            cd ..
            bash upload_gofile.sh firmware-dump.zip
          else
            echo "❌ No files to upload"
            exit 1
          fi
          
